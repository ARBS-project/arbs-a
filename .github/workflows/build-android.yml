# SPDX-License-Identifier: GPL-3.0-or-later
# ARBS-A Android build (CI1): unit tests, lint, debug APK and UNSIGNED release APK (nonRoot flavor),
# kept only as workflow artifacts. No signing key, no release, no tag.
# The debug APK is signed with the debug key Gradle creates on the runner for each run (not a secret).
name: build-android

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ARBS-A APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout arbs-a
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c  # v6.4.1

      - name: Tool versions
        run: |
          mkdir -p ci-evidence
          {
            echo "ImageOS=$ImageOS ImageVersion=$ImageVersion"
            echo "JAVA_HOME_17_X64=$JAVA_HOME_17_X64"
            "$JAVA_HOME_17_X64/bin/java" -version 2>&1
            echo "ANDROID_HOME=$ANDROID_HOME"
            ls "$ANDROID_HOME/ndk" "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" 2>&1
          } | tee ci-evidence/tools.txt

      - name: Build (unit tests, lint, debug and unsigned release APK)
        # JDK 17 of the runner image (same 17.0.21+9 build as the local toolchain).
        # gradlew is stored without the executable bit (git mode 100644), so it is started through bash.
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          bash ./gradlew --no-daemon --console=plain \
            testNonRootDebugUnitTest lintNonRootDebug assembleNonRootDebug assembleNonRootRelease

      - name: Report (package info, signature state, file list)
        if: always()
        run: |
          bt="$ANDROID_HOME/build-tools/36.0.0"
          rel=$(ls app/build/outputs/apk/nonRoot/release/*.apk 2>/dev/null | head -1)
          dbg=$(ls app/build/outputs/apk/nonRoot/debug/*.apk 2>/dev/null | head -1)
          for apk in $rel $dbg; do
            {
              echo "== $apk $(stat -c %s "$apk") bytes sha256=$(sha256sum "$apk" | cut -d' ' -f1)"
              "$bt/aapt2" dump badging "$apk" | grep -E "^(package|sdkVersion|targetSdkVersion):" || true
              if "$bt/apksigner" verify "$apk" >/dev/null 2>&1; then echo "apksigner verify: SIGNED"; else echo "apksigner verify: NOT SIGNED (rc=$?)"; fi
              echo "META-INF signature files: $(unzip -Z1 "$apk" | grep -cE '^META-INF/.*\.(RSA|DSA|EC|SF)$')"
            } >> ci-evidence/apk-report.txt
            unzip -Z1 "$apk" | sort > "ci-evidence/$(basename "$apk").list.txt"
          done
          cat ci-evidence/apk-report.txt || true

      - name: Upload APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: arbs-a-apks
          path: |
            app/build/outputs/apk/nonRoot/debug/*.apk
            app/build/outputs/apk/nonRoot/release/*-unsigned.apk
          retention-days: 7
          if-no-files-found: error

      - name: Upload CI evidence and lint report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: arbs-a-ci-evidence
          path: |
            ci-evidence/
            app/build/reports/
          retention-days: 7
          if-no-files-found: warn
